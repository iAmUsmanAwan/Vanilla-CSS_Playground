<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>
        .outerBox {
    background-color: antiquewhite;
    width: full;
    height: full;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    flex-direction: column-reverse;
    }

        .innerBox {
    background-color: yellow;
    height:100px;
    width: 100px;
    margin: 10px;
    border-width: 10px;
    border-color: green;
    display: flex;
    justify-content: center;
    align-items: center;
    
}
    </style>

</head>

<body>
    <div class="outerBox">
        <div class="innerBox">1</div>
        <div class="innerBox">2</div>
        <div class="innerBox">3</div>
        <div class="innerBox">4</div>
        <div class="innerBox">5</div>
    </div>
</body>
</html>
